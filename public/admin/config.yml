# 어드민(/admin/)의 폼 정의입니다. 이 파일을 고치면 폼이 바뀝니다.
#
# 어디서 고치나
#   - github.com 에서 이 파일을 열고 연필 아이콘 → 커밋 (폰에서도 됩니다)
#   - 또는 로컬에서 고치고 push
#   어드민 화면 안에서 이 파일을 고칠 수는 없습니다. Sveltia 에 설정 편집
#   UI 가 아직 없습니다(로드맵에는 있음).
#
# ⚠️ YAML 문법이 깨지면 어드민이 열리지 않습니다.
#   그때는 github.com 에서 이 파일을 되돌리면 살아납니다. 저장소에 있는
#   그냥 텍스트 파일이라 복구는 항상 가능합니다.
#
# 마음대로 고쳐도 되는 것 (여기만 바꾸면 끝)
#   label, label_singular, description, hint  — 화면에 보이는 문구
#   fields 순서                                — 폼에서의 위아래
#   required, default, collapsed               — 입력 편의
#   sortable_fields, summary, view_groups      — 목록 화면
#
# 필드를 새로 추가하는 것도 안전합니다.
#   모르는 항목은 사이트 빌드에서 조용히 무시되므로 빌드가 깨지지 않습니다.
#   다만 그 값이 화면에 나오게 하려면 두 곳을 더 고쳐야 합니다:
#     1) src/content.config.ts   — 스키마에 필드 추가
#     2) 해당 컴포넌트/레이아웃    — 실제로 출력
#
# 필드를 지우거나 이름을 바꿀 때는 조심하세요.
#   src/content.config.ts 에서 필수(required)로 잡혀 있는 항목을 폼에서
#   없애면, 그 뒤로 저장한 글이 빌드에서 걸립니다. 지우기 전에 그쪽을
#   먼저 optional 로 바꾸세요.
#
# 지금 필수인 항목
#   글       title, date
#   해온 일   title, kind, period, order, summary
#   북마크    title, date, url, source

backend:
  name: github
  repo: juunho/juunho.github.io
  branch: main
  commit_messages:
    create: 'admin: {{collection}} 추가 — {{slug}}'
    update: 'admin: {{collection}} 수정 — {{slug}}'
    delete: 'admin: {{collection}} 삭제 — {{slug}}'
    uploadMedia: 'admin: 파일 업로드 — {{path}}'
    deleteMedia: 'admin: 파일 삭제 — {{path}}'
  # OAuth("Sign in with GitHub" 버튼)로 바꾸려면 인증 서버 주소를 여기에.
  # 없으면 토큰 로그인만 쓰며, 그것만으로도 충분히 동작합니다.
  # base_url: https://<your-worker>.workers.dev

media_folder: public/uploads
public_folder: /uploads

# 커밋 메시지에서 CMS 로 쓴 것임을 알 수 있게
slug:
  encoding: unicode
  clean_accents: true

collections:
  # ── 여기에 직접 쓰는 글 ──────────────────────────────────────
  - name: posts
    label: 글
    label_singular: 글
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    view_groups:
      - label: 상태
        field: draft
    fields:
      - { name: title, label: 제목, widget: string }
      - {
          name: date,
          label: 날짜,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - {
          name: description,
          label: 한 줄 요약,
          widget: text,
          required: false,
          hint: '목록과 검색 결과, 그리고 링크 미리보기에 쓰입니다.',
        }
      - {
          name: tags,
          label: 태그,
          widget: list,
          default: [],
          hint: '첫 번째 태그가 목록 오른쪽에 표시됩니다.',
        }
      - {
          name: draft,
          label: 초안,
          widget: boolean,
          default: false,
          hint: '켜두면 배포에 포함되지 않습니다. 로컬에서는 보입니다.',
        }
      - {
          name: body,
          label: 본문,
          widget: markdown,
          hint: '수식은 $x$ 또는 $$ ... $$ 로 씁니다.',
        }

  # ── 다른 데 쓴 글 (북마크) ───────────────────────────────────
  - name: links
    label: 다른 데 쓴 글
    files:
      - name: links
        label: 북마크 목록
        file: src/content/links.yaml
        description: 'velog, Medium 등 외부에 쓴 글. 글 목록에 같이 섞여 나옵니다.'
        fields:
          - name: links
            label: 링크
            label_singular: 링크
            widget: list
            summary: '{{fields.title}} — {{fields.source}}'
            fields:
              - { name: title, label: 제목, widget: string }
              - {
                  name: date,
                  label: 날짜,
                  widget: datetime,
                  date_format: 'YYYY-MM-DD',
                  time_format: false,
                  picker_utc: true,
                }
              - { name: url, label: 원본 주소, widget: string }
              - {
                  name: source,
                  label: 출처,
                  widget: string,
                  hint: '목록에 "↗ velog" 처럼 표시됩니다.',
                }
              - { name: tags, label: 태그, widget: list, default: [] }
              - {
                  name: note,
                  label: 메모,
                  widget: text,
                  required: false,
                  hint: '왜 걸어뒀는지 한 줄. 비워도 됩니다.',
                }

  # ── 해온 일 ─────────────────────────────────────────────────
  - name: work
    label: 해온 일
    label_singular: 이력
    folder: src/content/work
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{period}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: 제목, widget: string }
      - {
          name: kind,
          label: 분류,
          widget: string,
          hint: '제목 옆에 작게 붙습니다. 예: Retrieval, Training, Serving, Open Source',
        }
      - {
          name: period,
          label: 기간,
          widget: string,
          hint: '왼쪽 컬럼에 그대로 나옵니다. 예: 2025 — 현재',
        }
      - {
          name: order,
          label: 정렬 순서,
          widget: number,
          value_type: int,
          hint: '큰 값이 위로 옵니다.',
        }
      - { name: summary, label: 설명, widget: text }
      - { name: stack, label: 스택, widget: list, default: [] }
      - {
          name: link,
          label: 링크,
          widget: object,
          required: false,
          collapsed: true,
          fields:
            [
              { name: href, label: 주소, widget: string },
              { name: label, label: 표시할 문구, widget: string },
            ],
        }
