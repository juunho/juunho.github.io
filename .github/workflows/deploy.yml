name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR 에서는 빌드만 돌려서 머지 전에 깨지는지 확인합니다 (배포는 안 함).
  pull_request:
    branches: [main]
  # Actions 탭에서 수동으로도 돌릴 수 있게
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and search index
        run: npm run build

      # 빌드는 폰트를 네트워크에서 받아옵니다. 실패해도 폴백 폰트로 빌드가
      # 통과해버리므로, 폰트 파일이 실제로 나왔는지 확인합니다.
      - name: Verify fonts were downloaded
        run: |
          count=$(find dist/_astro/fonts -type f 2>/dev/null | wc -l)
          echo "downloaded font files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::폰트를 받지 못해 폴백 서체로 빌드되었습니다."
          fi

      # 어드민은 로컬 전용입니다. GitHub Pages 에는 접근 제어를 걸 수 없으므로
      # 배포물에 섞여 들어가면 누구나 열 수 있게 됩니다. 그럴 바엔 빌드를
      # 실패시킵니다.
      - name: Fail if the admin leaked into the build
        run: |
          if find dist -iname '*admin*' | grep -q . || grep -rlq sveltia dist; then
            echo "::error::어드민이 배포물에 포함되었습니다. 로컬 전용이어야 합니다."
            find dist -iname '*admin*'
            grep -rl sveltia dist || true
            exit 1
          fi
          echo "admin is absent from dist, as expected"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
