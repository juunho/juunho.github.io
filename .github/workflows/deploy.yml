name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR 에서는 빌드만 돌려서 머지 전에 깨지는지 확인합니다 (배포는 안 함).
  pull_request:
    branches: [main]
  # Actions 탭에서 수동으로도 돌릴 수 있게
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and search index
        run: npm run build

      # 빌드는 폰트를 네트워크에서 받아옵니다. 실패해도 폴백 폰트로 빌드가
      # 통과해버리므로, 폰트 파일이 실제로 나왔는지 확인합니다.
      - name: Verify fonts were downloaded
        run: |
          count=$(find dist/_astro/fonts -type f 2>/dev/null | wc -l)
          echo "downloaded font files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::폰트를 받지 못해 폴백 서체로 빌드되었습니다."
          fi

      # 어드민은 배포되지만, 그 안에 자격증명이 들어가서는 절대 안 됩니다.
      # 로그인은 사용자가 브라우저에 직접 넣는 토큰으로만 이루어집니다.
      - name: Check the admin ships without credentials
        run: |
          test -f dist/admin/index.html || { echo "::error::어드민이 빌드되지 않았습니다."; exit 1; }
          test -f dist/admin/config.yml || { echo "::error::어드민 설정이 빌드되지 않았습니다."; exit 1; }

          # GitHub 토큰 형태(ghp_ / github_pat_ / gho_)가 배포물에 있으면 중단
          if grep -rEl 'gh[po]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' dist; then
            echo "::error::배포물에 GitHub 토큰으로 보이는 문자열이 있습니다."
            exit 1
          fi
          echo "admin present, no credentials embedded"

      # config.yml 은 손으로 고치는 파일입니다. YAML 이 깨지면 어드민이 아예
      # 열리지 않으므로, 배포하기 전에 여기서 걸러냅니다.
      - name: Validate the admin config
        run: |
          node --input-type=module -e "
            import { load } from 'js-yaml';
            import { readFileSync } from 'node:fs';

            let config;
            try {
              config = load(readFileSync('dist/admin/config.yml', 'utf8'));
            } catch (error) {
              console.log('::error::어드민 config.yml 의 YAML 문법이 깨졌습니다: ' + error.message);
              process.exit(1);
            }

            const names = (config?.collections ?? []).map((c) => c.name);
            for (const required of ['posts', 'work', 'links']) {
              if (!names.includes(required)) {
                console.log('::error::어드민 config.yml 에 \'' + required + '\' 컬렉션이 없습니다.');
                process.exit(1);
              }
            }
            console.log('admin config is valid; collections: ' + names.join(', '));
          "

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
